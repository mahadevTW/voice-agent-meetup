<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <div class="scene">
    <header class="hero">
      <p class="eyebrow">Voice Agent Meetup &middot; Realtime</p>
      <h1>Talk it through.</h1>
      <p class="subhead">Ask about the weather, do some math, or check an order status. The agent listens, thinks, and acts — out loud.</p>
    </header>

    <div class="workspace">
      <section class="transcript-panel" aria-label="Conversation transcript">
        <div class="transcript-header">
          <h2>Transcript</h2>
          <button id="download-btn" class="btn btn-text" hidden>Download JSON</button>
        </div>
        <p id="transcript-empty" class="transcript-empty">Nothing said yet — start a session and the conversation will appear here.</p>
        <ol id="transcript-log" class="transcript-log"></ol>
      </section>

      <section class="console" aria-label="Agent console">
        <div class="orb-stage">
          <div id="orb" class="orb" data-state="idle">
            <div class="orb-ring"></div>
            <div class="orb-core"></div>
          </div>
          <div id="waveform" class="waveform" data-active="false" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <p id="status" class="status">Idle</p>

        <div id="activity" class="activity" hidden>
          <span class="activity-dot"></span>
          <span id="activity-text"></span>
        </div>

        <div class="controls">
          <button id="start-btn" class="btn btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>
            <span>Start talking</span>
          </button>
          <button id="stop-btn" class="btn btn-ghost" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span>End session</span>
          </button>
        </div>
      </section>
    </div>
  </div>

  <audio id="agent-audio" autoplay></audio>

  <script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
